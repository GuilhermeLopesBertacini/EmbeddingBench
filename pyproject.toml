[project]
name = "embeddingbench"
version = "0.1.0"
description = "Scale embedding benchmark and ISP evaluation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
    "scikit-learn>=1.3.0",
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "timm>=1.0.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
